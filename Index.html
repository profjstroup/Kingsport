<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingsport Engagement</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0D1F1F;font-family:'Courier New',monospace;color:#E8E0D0;min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.85;}
#app{max-width:900px;margin:0 auto;padding:24px 20px;}
.hidden{display:none!important;}
#header{border-bottom:2px solid #B8A46A;padding-bottom:16px;margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
#header-logo{font-size:13px;letter-spacing:4px;color:#B8A46A;text-transform:uppercase;margin-bottom:2px;}
#header-sub{font-size:11px;letter-spacing:2px;color:#9AADA8;text-transform:uppercase;}
#module-label{font-size:11px;letter-spacing:2px;color:#9AADA8;text-transform:uppercase;margin-bottom:2px;text-align:right;}
#module-title{font-size:12px;letter-spacing:1px;color:#B8A46A;text-align:right;}
#mute-btn{position:fixed;top:14px;right:16px;background:#0D1F1F;border:1px solid #1E3A3A;color:#3D4A4A;font-size:16px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:100;line-height:1;}
#mute-btn:hover{border-color:#B8A46A;color:#B8A46A;}
#mute-btn.muted{border-color:#7A3B1E;color:#7A3B1E;}
#resource-bars{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.res-bar-group{flex:1;min-width:200px;}
.res-label{font-size:11px;letter-spacing:2px;color:#9AADA8;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;}
.res-label span{color:#B8A46A;}
.res-track{height:12px;background:#0D1F1F;border:1px solid #1E3A3A;}
.res-fill{height:100%;transition:width 0.3s;}
#money-fill{background:#B8A46A;}
#time-fill{background:#7A3B1E;}
.res-fill.warning{background:#8A4A3A!important;}
.narrator-text{color:#9AADA8;font-style:italic;font-size:13px;line-height:1.9;border-left:2px solid #3D4A4A;padding-left:14px;margin:14px 0;}
.narrator-text.kp{border-left-color:#4A6A58;}
.dlg{border:2px solid #B8A46A;margin-bottom:20px;background:#0D1F1F;}
.dlg.kp{border-color:#7A3B1E;background:#1A2A22;}
.dlg-hdr{background:#1E3A3A;padding:7px 14px 5px;display:flex;justify-content:space-between;align-items:baseline;}
.dlg.kp .dlg-hdr{background:#2C3E35;border-bottom:1px solid #3D5247;}
.dlg-name{font-size:12px;letter-spacing:2px;color:#B8A46A;font-weight:bold;}
.dlg.kp .dlg-name{color:#F2EDE4;}
.dlg-ttl{font-size:11px;color:#9AADA8;letter-spacing:1px;}
.dlg-row{display:flex;border-bottom:1px solid #1E3A3A;}
.dlg.kp .dlg-row{border-bottom-color:#3D5247;}
.dlg-portrait{flex-shrink:0;padding:8px;}
.dlg-portrait canvas{display:block;image-rendering:pixelated;}
.dlg-body{padding:14px 18px;font-size:13px;line-height:1.9;flex:1;display:flex;align-items:center;color:#E8E0D0;}
.dlg-foot{background:#0A1A1A;padding:5px 14px;font-size:11px;color:#9AADA8;}
.dlg.kp .dlg-foot{background:#1A2A22;}
.email-block{background:#0A1A1A;border:1px solid #1E3A3A;padding:16px;margin-bottom:4px;font-size:13px;line-height:1.85;}
.email-from{font-size:11px;color:#B8A46A;letter-spacing:1px;margin-bottom:3px;}
.email-subject{font-size:11px;color:#9AADA8;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid #1E3A3A;}
.email-body{color:#E8E0D0;}
.sec-head{font-size:11px;letter-spacing:3px;color:#B8A46A;text-transform:uppercase;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid #1E3A3A;}
.sec-head.kp{color:#9AADA8;border-bottom-color:#3D5247;}
.sec-head-lg{font-size:16px;letter-spacing:2px;color:#B8A46A;text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #B8A46A;font-weight:bold;}
.dec-label{font-size:15px;letter-spacing:2px;color:#B8A46A;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #3D4A4A;font-weight:bold;}
.dec-label.kp{color:#8AC8A0;border-bottom-color:#3D5A48;}
.force-info{background:#0A0A1A;border:1px solid #2E3A4A;padding:18px;margin-bottom:4px;font-size:13px;line-height:1.85;color:#9AADA8;font-style:italic;}
.force-info strong{color:#E8E0D0;font-style:normal;}
.dec-prompt{background:#1E3A3A;border-left:3px solid #B8A46A;padding:14px 16px;font-size:14px;line-height:1.85;margin-bottom:14px;color:#E8E0D0;font-weight:bold;}
.dec-prompt.kp{background:#2C3E35;border-left-color:#7A3B1E;color:#F2EDE4;}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.cards-grid{grid-template-columns:1fr;}}
.card{border:1px solid #4A5A5A;background:#0D1F1F;padding:16px;cursor:pointer;transition:all 0.15s;position:relative;user-select:none;}
.card.kp{background:#1A2A22;border-color:#3D5A48;}
.card:hover:not(.disabled):not(.selected){border-color:#B8A46A;background:#0F2626;}
.card.kp:hover:not(.disabled):not(.selected){border-color:#7A3B1E;background:#1E3028;}
.card.selected{border-color:#B8A46A;background:#0F2626;border-width:2px;}
.card.kp.selected{border-color:#B8A46A;background:#1E3028;border-width:2px;}
.card.disabled{opacity:0.38;cursor:not-allowed;}
.card-opt{font-size:11px;color:#B8A46A;letter-spacing:1px;margin-bottom:6px;font-weight:bold;}
.card.kp .card-opt{color:#8AC8A0;}
.card-title{font-size:13px;color:#E8E0D0;margin-bottom:8px;line-height:1.4;font-weight:bold;}
.card-cost{font-size:11px;color:#B8A46A;margin-bottom:7px;}
.card.kp .card-cost{color:#8AC8A0;}
.card-desc{font-size:12px;color:#9AADA8;line-height:1.65;}
.card-tag{font-size:10px;color:#C45A4A;margin-top:5px;letter-spacing:1px;}
.card-check{position:absolute;top:12px;right:12px;width:18px;height:18px;border:1px solid #4A5A5A;display:flex;align-items:center;justify-content:center;font-size:13px;color:#B8A46A;}
.card.selected .card-check{border-color:#B8A46A;background:#0D1F1F;}
.tooltip{display:none;position:absolute;bottom:100%;left:0;right:0;background:#1A0A00;border:1px solid #8A4A3A;padding:8px 10px;font-size:11px;color:#E8E0D0;line-height:1.6;z-index:10;margin-bottom:4px;}
.card.disabled:hover .tooltip{display:block;}
.mutex-note{font-size:11px;color:#C45A4A;margin-top:8px;min-height:18px;}
.rat-block{background:#0A1A1A;border:1px solid #1E3A3A;padding:16px;margin-bottom:16px;}
.rat-label{font-size:11px;letter-spacing:2px;color:#B8A46A;text-transform:uppercase;margin-bottom:8px;}
.rat-label.kp{color:#9AADA8;}
.rat-hint{font-size:11px;color:#9AADA8;margin-bottom:10px;line-height:1.6;}
.rat-input{width:100%;background:#0D1F1F;border:1px solid #4A5A5A;color:#E8E0D0;font-family:'Courier New',monospace;font-size:13px;padding:12px;resize:vertical;min-height:90px;line-height:1.75;}
.rat-input:focus{outline:none;border-color:#B8A46A;}
.conf-row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap;}
.conf-lbl{font-size:11px;color:#9AADA8;letter-spacing:1px;margin-right:4px;}
.conf-btn{border:1px solid #4A5A5A;background:#0D1F1F;color:#9AADA8;font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;padding:6px 14px;cursor:pointer;transition:all 0.15s;}
.conf-btn:hover{border-color:#B8A46A;color:#B8A46A;}
.conf-btn.active{border-color:#B8A46A;color:#B8A46A;background:#0F2626;}
.val-hint{font-size:11px;color:#C45A4A;margin-top:6px;min-height:16px;}
.confirm-btn{width:100%;background:#0D1F1F;border:2px solid #B8A46A;color:#B8A46A;font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:12px;cursor:pointer;transition:all 0.15s;margin-top:10px;}
.confirm-btn:hover:not(:disabled){background:#B8A46A;color:#0D1F1F;}
.confirm-btn:disabled{opacity:0.38;cursor:not-allowed;}
.confirm-btn.kp{border-color:#7A3B1E;color:#F2EDE4;}
.confirm-btn.kp:hover:not(:disabled){background:#7A3B1E;}
.next-btn{width:100%;background:#0D1F1F;border:2px solid #B8A46A;color:#B8A46A;font-family:'Courier New',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;padding:14px;cursor:pointer;transition:all 0.2s;margin-top:18px;display:block;text-align:center;}
.next-btn:hover:not(.dim):not(:disabled){background:#B8A46A;color:#0D1F1F;}
.next-btn.dim,.next-btn:disabled{border-color:#3D4A4A;color:#4A5A5A;cursor:not-allowed;}
.recap-sec{background:#1E3A3A;border:1px solid #3D4A4A;padding:18px;margin-bottom:18px;}
.recap-sec h3{font-size:11px;letter-spacing:2px;color:#B8A46A;text-transform:uppercase;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid #3D4A4A;}
.recap-sec h3.section-title{font-size:13px;letter-spacing:2px;color:#B8A46A;text-transform:uppercase;}
.recap-con{font-size:12px;color:#C0CEC8;padding:8px 0 8px 20px;line-height:1.75;border-bottom:1px solid #0D1F1F;position:relative;}
.recap-con::before{content:'\2022';position:absolute;left:6px;color:#B8A46A;font-size:14px;line-height:1.6;}
.recap-con:last-child{border-bottom:none;}
.recap-con strong{color:#E8E0D0;}
.receipt-box{background:#0D1F1F;border:1px solid #1E3A3A;padding:14px;font-size:11px;line-height:1.85;white-space:pre-wrap;color:#9AADA8;max-height:220px;overflow-y:auto;margin-top:10px;}
.copy-btn{background:#0D1F1F;border:2px solid #B8A46A;color:#B8A46A;font-family:'Courier New',monospace;font-size:11px;letter-spacing:1px;padding:9px 18px;cursor:pointer;margin-top:10px;transition:all 0.15s;display:inline-block;}
.copy-btn:hover{background:#B8A46A;color:#0D1F1F;}
.copy-btn.copied{border-color:#6ABA6A;color:#6ABA6A;}
.recap-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #0D1F1F;}
.recap-row:last-child{border-bottom:none;}
.rk{color:#9AADA8;}.rv{color:#E8E0D0;}.rv.good{color:#6ABA6A;}.rv.warn{color:#B8A46A;}.rv.bad{color:#C45A4A;}
.heat-map{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px;}
.heat-cell{padding:10px 7px;font-size:10px;letter-spacing:1px;text-align:center;border:1px solid #1E3A3A;text-transform:uppercase;line-height:1.4;}
.heat-cell.h-high{background:#3A2A0A;border-color:#B8A46A;color:#B8A46A;}
.heat-cell.h-med{background:#2A1E0A;border-color:#7A5A20;color:#9A7A40;}
.heat-cell.h-blank{background:#0A1010;border-color:#1E3A3A;color:#2E4A4A;}
.divider{height:1px;background:#1E3A3A;margin:22px 0;}
.preview-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.preview-item{font-size:11px;color:#9AADA8;}
.preview-item span{color:#B8A46A;}
.insuf{font-size:11px;color:#C45A4A;margin-top:7px;display:none;}
.resp-tag{display:inline-block;font-size:10px;letter-spacing:1px;padding:2px 7px;border:1px solid #4A5A5A;color:#9AADA8;margin-left:8px;text-transform:uppercase;vertical-align:middle;}
.resp-tag.avoid{border-color:#C45A4A;color:#C45A4A;}
.resp-tag.reduce{border-color:#6ABA6A;color:#6ABA6A;}
.resp-tag.transfer{border-color:#B8A46A;color:#B8A46A;}
.resp-tag.accept{border-color:#9AADA8;color:#9AADA8;}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.3}}
.flash{animation:flash 0.4s ease 2;}
.page-nav{display:flex;gap:12px;margin-top:18px;}
.page-nav-btn{flex:1;background:#0D1F1F;border:1px solid #3D4A4A;color:#9AADA8;font-family:'Courier New',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:10px;cursor:pointer;transition:all 0.15s;}
.page-nav-btn:hover:not(:disabled){border-color:#B8A46A;color:#B8A46A;}
.page-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.page-nav-btn.primary{border-color:#B8A46A;color:#B8A46A;}
.page-nav-btn.primary:hover:not(:disabled){background:#B8A46A;color:#0D1F1F;}
.page-indicator{text-align:center;font-size:10px;color:#4A5A5A;letter-spacing:2px;margin-top:8px;}
#title-screen{text-align:center;padding:60px 20px;}
.title-company{font-size:13px;letter-spacing:5px;color:#B8A46A;text-transform:uppercase;margin-bottom:5px;}
.title-sub{font-size:11px;letter-spacing:3px;color:#9AADA8;text-transform:uppercase;margin-bottom:48px;}
.title-main{font-size:22px;letter-spacing:6px;color:#E8E0D0;text-transform:uppercase;margin-bottom:10px;}
.title-tag{font-size:12px;letter-spacing:2px;color:#9AADA8;margin-bottom:48px;}
.start-btn{background:#0D1F1F;border:2px solid #B8A46A;color:#B8A46A;font-family:'Courier New',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:16px 44px;cursor:pointer;transition:all 0.2s;}
.start-btn:hover{background:#B8A46A;color:#0D1F1F;}
.rel-bar-wrap{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #0D1F1F;}
.rel-bar-label{font-size:12px;color:#B8A46A;font-weight:bold;margin-bottom:4px;}
.rel-bar-track{height:8px;background:#1E3A3A;margin-bottom:6px;}
.rel-bar-fill{height:100%;transition:width 0.4s;}
.rel-bar-desc{font-size:11px;color:#9AADA8;line-height:1.6;}
.risk-response-legend{background:#1A2A1A;border:2px solid #B8A46A;padding:20px 22px;margin-bottom:18px;font-size:13px;color:#C0CEC8;line-height:2.0;}
.risk-response-legend .rrl-title{font-size:12px;letter-spacing:3px;color:#B8A46A;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #3D4A4A;font-weight:bold;}
.risk-response-legend .rrl-row{display:flex;gap:10px;align-items:baseline;padding:3px 0;}
.risk-response-legend .rrl-tag{font-size:10px;letter-spacing:1px;padding:2px 8px;border:1px solid #B8A46A;color:#B8A46A;white-space:nowrap;flex-shrink:0;}
.risk-response-legend .rrl-tag.avoid{border-color:#C45A4A;color:#C45A4A;}
.risk-response-legend .rrl-tag.reduce{border-color:#6ABA6A;color:#6ABA6A;}
.risk-response-legend .rrl-tag.transfer{border-color:#B8A46A;color:#B8A46A;}
.risk-response-legend .rrl-tag.accept{border-color:#9AADA8;color:#9AADA8;}
.risk-response-legend .rrl-def{font-size:12px;color:#C0CEC8;}
</style>
</head>
<body>
<button id="mute-btn" onclick="toggleMute()" title="Toggle sound">&#128266;</button>
<div id="app">
<div id="title-screen">
  <canvas id="meridian-logo-canvas" width="96" height="96" style="image-rendering:pixelated;display:block;margin:0 auto 18px;"></canvas>
  <div class="title-company">Meridian Advisory Group</div>
  <div class="title-sub">Risk Assessment Division</div>
  <div class="title-main">Kingsport Industrial Services</div>
  <div class="title-tag">A Risk Management Engagement</div>
  <button class="start-btn" onclick="startGame()">BEGIN ENGAGEMENT &#9658;</button>
</div>
<div id="game-screen" class="hidden">
  <div id="header">
    <div><div id="header-logo">Meridian Advisory Group</div><div id="header-sub">Risk Assessment Division</div></div>
    <div><div id="module-label">Current Module</div><div id="module-title">Module 5</div></div>
  </div>
  <div id="resource-bars">
    <div class="res-bar-group">
      <div class="res-label">Budget Remaining <span id="money-display">$20,000</span></div>
      <div class="res-track"><div id="money-fill" class="res-fill" style="width:100%"></div></div>
    </div>
    <div class="res-bar-group">
      <div class="res-label">Time Remaining <span id="time-display">40 units</span></div>
      <div class="res-track"><div id="time-fill" class="res-fill" style="width:100%"></div></div>
    </div>
  </div>
  <div id="content-area"></div>
</div>
</div>
<script>
var animACtx=null;
function animAC(){
  if(!animACtx)animACtx=new(window.AudioContext||window.webkitAudioContext)();
  if(animACtx.state==='suspended')animACtx.resume();
  return animACtx;
}
var P={
  ABYSS:'#0D1F1F',TEAL:'#1E3A3A',GOLD:'#B8A46A',PARCH:'#F5F0E8',
  SLATE:'#3D4A4A',NAVY:'#1A2E44',IRON:'#2C3E35',FORGE:'#3D5247',
  RUST:'#7A3B1E',STEEL:'#8A9B8E',CREAM:'#F2EDE4',CHAR:'#1A1A1A',
  MID:'#5A5A5A',WARN:'#C04A2A',SMOKE1:'#4A5A4A',SMOKE2:'#3A4A3A',
  SMOKE3:'#2A3A2A',RED:'#8A1A1A',LGREY:'#9A9A9A',DGREY:'#2A2A2A',
  WHITE:'#F5F0E8',DNAVY:'#1A2E44',ORANGE:'#C06020',YELLOW:'#C8A020',
  SKIN:'#C8A882',DARKGREEN:'#1A2E1A',LITEIRON:'#3D5247',
  FLOORGREY:'#2A3030',CEILGREY:'#1A2828',WALLGREY:'#243030',
  METALLT:'#6A7A7A',METALDARK:'#1A2A2A',PIPERUST:'#6A3010',
  GLASS:'#2A4A4A',SCREENGREEN:'#20C040',SCREENDARK:'#004010',
  PAPERYELLOW:'#E8DCA0',GOVBLUE:'#1A2A4A',GOVLT:'#2A3A5A',
  CHARTBG:'#0A1818',CHARTGRID:'#1A2828',GREEN:'#20C040',
  WOODDK:'#2A1A0A',WOODLT:'#3A2A1A',WOODGRAIN:'#241408',
  NEWSPRINT:'#E8E4D8',PHONEGREY:'#4A4A4A',PHONEDK:'#2A2A2A',
  CLOCKFACE:'#F0E8D0',WINBLUE:'#1A2A6A',WINLT:'#2A3A8A',
  WINGREY:'#C0C0C0',WINDK:'#808080',WINTEAL:'#008080',
  SCREENGREY:'#D0D0D0',ERRRED:'#C02020',PROGBLUE:'#0000A8',
  SKYBLUE:'#1A3050',DESKLT:'#3A2A1A'
};
var GW=108,GH=68,S3=3;
function apx(c,x,y,col){if(x<0||x>=GW||y<0||y>=GH)return;c.fillStyle=col;c.fillRect(x*S3,y*S3,S3,S3);}
function arect(c,x,y,w,h,col){if(w<=0||h<=0)return;c.fillStyle=col;c.fillRect(x*S3,y*S3,w*S3,h*S3);}
function ahline(c,x,y,w,col){arect(c,x,y,w,1,col);}
function avline(c,x,y,h,col){arect(c,x,y,1,h,col);}
function aclear(c,col){c.fillStyle=col;c.fillRect(0,0,GW*S3,GH*S3);}
function aborder(c,col){ahline(c,0,0,GW,col);ahline(c,0,GH-1,GW,col);avline(c,0,0,GH,col);avline(c,GW-1,0,GH,col);}
function agtext(c,str,x,y,col,sz,bold){sz=sz||6;bold=(bold===undefined)?true:bold;c.fillStyle=col;c.font=(bold?'bold ':'')+sz+'px Courier New';c.fillText(str,x*S3,y*S3);}
function adither(c,x,y,w,h,c1,c2){for(var dy=0;dy<h;dy++)for(var dx=0;dx<w;dx++)apx(c,x+dx,y+dy,(dx+dy)%2===0?c1:c2);}
function afcircle(c,cx,cy,r,col){for(var dy=-r;dy<=r;dy++)for(var dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)apx(c,cx+dx,cy+dy,col);}
function acircle(c,cx,cy,r,col){for(var a=0;a<360;a+=3)apx(c,cx+Math.round(Math.cos(a*Math.PI/180)*r),cy+Math.round(Math.sin(a*Math.PI/180)*r),col);}
function alerp(a,b,t){return a+(b-a)*t;}
function aeaseOut(t){return 1-Math.pow(1-t,3);}
